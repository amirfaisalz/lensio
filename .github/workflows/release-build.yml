name: Lensio Release Build & Packaging

# Triggered by the CI workflow, whose master gate includes the security gates
# (security.yml runs inside CI via workflow_call), so a failing scan blocks the
# image from ever being built.
on:
  workflow_run:
    workflows: ["Lensio CI & Quality Gate"]
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Explicit version tag (e.g. 1.4.0)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Package Container Images
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Tag from the commit actually checked out. On workflow_run, github.sha is
      # the current main head, which may already be a newer commit than the one
      # being built; deploy.yml derives the same tag the same way.
      - name: Resolve Commit Tag
        id: commit
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/lensio-api
          tags: |
            type=raw,value=${{ steps.commit.outputs.tag }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=${{ inputs.version_tag }},enable=${{ inputs.version_tag != '' }}

      - name: Extract Docker Metadata (Dashboard)
        id: meta-dash
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/lensio-dashboard
          tags: |
            type=raw,value=${{ steps.commit.outputs.tag }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=${{ inputs.version_tag }},enable=${{ inputs.version_tag != '' }}

      - name: Build & Push Lensio API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          # Separate scopes: a shared one makes each build overwrite the other's cache.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & Push Lensio Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: apps/dashboard
          file: apps/dashboard/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-dash.outputs.tags }}
          labels: ${{ steps.meta-dash.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Summarize Build Artifacts
        env:
          TAGS: ${{ steps.meta-api.outputs.tags }}
        run: |
          {
            echo "### 📦 Packaged Container Images"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
