name: Lensio Automated Security Gates

# Pushes and PRs run these gates through ci.yml (workflow_call), so the CI master
# gate, and therefore the release build, is blocked by a failing scan. No
# concurrency block: in a called workflow github.workflow is the caller's name, so
# the group would collide with CI's own and cancel it.
on:
  workflow_call:
  schedule:
    - cron: '0 0 * * 1' # Weekly security audit
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # 1. Secret Scanning (Gitleaks)
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ----------------------------------------------------------------------------
  # 2. Dependency Vulnerability Scanning (Go govulncheck & NPM Audit)
  # ----------------------------------------------------------------------------
  dependency-scan:
    name: Dependency Scanning (govulncheck & npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run govulncheck (Go)
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: 'go.mod'
          go-package: './...'
          check-latest: false

      - name: Run npm audit (Dashboard)
        working-directory: apps/dashboard
        run: |
          npm audit --audit-level=high

  # ----------------------------------------------------------------------------
  # 3. Static Application Security Testing (SAST - gosec)
  # ----------------------------------------------------------------------------
  sast:
    name: Go SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install & Run gosec
        run: |
          # Pinned: @latest changes the gate between runs, as golangci-lint did.
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -quiet -exclude-dir=tests -severity=high ./...

  # ----------------------------------------------------------------------------
  # 4. Infrastructure as Code Scanning (OpenTofu / Trivy IaC)
  # ----------------------------------------------------------------------------
  iac-scan:
    name: IaC Security Scan (Trivy / tfsec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan IaC Configurations with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'infra/'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # 5. Container Image Vulnerability Scanning (Trivy)
  # ----------------------------------------------------------------------------
  container-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: lensio-api:security-scan

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'lensio-api:security-scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build Dashboard Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: apps/dashboard
          file: apps/dashboard/Dockerfile
          load: true
          tags: lensio-dashboard:security-scan

      - name: Scan Dashboard Image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'lensio-dashboard:security-scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # 6. Security Quality Gate Aggregator
  # ----------------------------------------------------------------------------
  security-gate:
    name: Security Master Quality Gate
    needs:
      - secret-scan
      - dependency-scan
      - sast
      - iac-scan
      - container-scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify All Security Gates Passed
        run: |
          if [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.dependency-scan.result }}" != "success" ] || \
             [ "${{ needs.sast.result }}" != "success" ] || \
             [ "${{ needs.iac-scan.result }}" != "success" ] || \
             [ "${{ needs.container-scan.result }}" != "success" ]; then
            echo "❌ Security Quality Gate Failed: High or critical vulnerabilities detected." >&2
            exit 1
          fi
          echo "✅ All Security Quality Gates Passed Cleanly!"
