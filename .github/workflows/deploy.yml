name: Lensio Deployment & Environment Promotion

on:
  workflow_run:
    workflows: ["Lensio Release Build & Packaging"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment (production always deploys and smoke-tests staging first)'
        type: choice
        options:
          - staging
          - production
        default: staging
      image_tag:
        description: 'Image tag to deploy (e.g. 1.4.0 or sha-a1b2c3d)'
        required: true

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  # ----------------------------------------------------------------------------
  # 1. Staging: every build from main, and the mandatory first leg of a promotion
  # ----------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging (Azure Container Apps)
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.image-meta.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine Deployment Image Tag
        id: image-meta
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            # Same fixed length release-build.yml tags with.
            TAG="sha-$(git rev-parse --short=7 HEAD)"
          fi
          # Immutable tags only: a mutable one (latest, main) cannot be rolled back to.
          if ! [[ "${TAG}" =~ ^(sha-[0-9a-f]{7}|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::image_tag must be sha-<7 hex> or <semver>, got '${TAG}'"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Staging Container Apps
        run: ./scripts/deploy.sh staging "${{ steps.image-meta.outputs.tag }}"

      - name: Run Staging Automated Smoke Tests
        id: smoke-test
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_DASH_URL: ${{ vars.STAGING_DASH_URL }}
        run: |
          set -euo pipefail
          # Until a custom domain is live, fall back to the apps' own ingress FQDNs.
          API_URL="${STAGING_API_URL:-https://$(az containerapp show -n ca-api-lensio-staging -g rg-lensio-staging --query properties.configuration.ingress.fqdn -o tsv)}"
          DASH_URL="${STAGING_DASH_URL:-https://$(az containerapp show -n ca-dash-lensio-staging -g rg-lensio-staging --query properties.configuration.ingress.fqdn -o tsv)}"
          ./scripts/smoke-test.sh "${API_URL}" "${DASH_URL}"

      - name: Automated Rollback on Smoke Test Failure
        if: failure() && steps.smoke-test.outcome == 'failure'
        run: ./scripts/rollback.sh --env staging --app all --target-revision previous --traffic 100 --no-verify

  # ----------------------------------------------------------------------------
  # 2. Production: manual dispatch only, and only a tag that just passed staging
  # ----------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production (Azure Container Apps)
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' && inputs.target_env == 'production'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Production Container Apps
        run: ./scripts/deploy.sh production "${{ needs.deploy-staging.outputs.tag }}"

      - name: Run Production Automated Smoke Tests
        id: smoke-test
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          PROD_DASH_URL: ${{ vars.PROD_DASH_URL }}
        run: |
          set -euo pipefail
          API_URL="${PROD_API_URL:-https://$(az containerapp show -n ca-api-lensio-production -g rg-lensio-production --query properties.configuration.ingress.fqdn -o tsv)}"
          DASH_URL="${PROD_DASH_URL:-https://$(az containerapp show -n ca-dash-lensio-production -g rg-lensio-production --query properties.configuration.ingress.fqdn -o tsv)}"
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
          ./scripts/smoke-test.sh "${API_URL}" "${DASH_URL}"

      - name: Automated Rollback on Smoke Test Failure
        if: failure() && steps.smoke-test.outcome == 'failure'
        env:
          API_URL: ${{ steps.smoke-test.outputs.api_url }}
        run: |
          echo "🚨 Production Smoke Tests failed! Initiating emergency rollback..."
          ./scripts/rollback.sh --env production --app all --target-revision previous --traffic 100 --api-url "${API_URL}"
