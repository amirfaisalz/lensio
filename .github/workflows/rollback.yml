name: Lensio Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        type: choice
        options:
          - production
          - staging
        default: production
        required: true
      app:
        description: 'Component to roll back'
        type: choice
        options:
          - api
          - dashboard
          - all
        default: api
        required: true
      target_revision:
        description: 'Revision name to shift traffic to, or "previous" (required for app=all)'
        default: 'previous'
        required: true
      traffic_percentage:
        description: 'Traffic percentage to allocate to target revision'
        default: '100'
        required: true
      incident_reason:
        description: 'Reason for rollback (incident / alert context)'
        required: true
        default: 'P95 latency degradation or 5xx error spike'

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    name: Execute <60s Traffic Rollback
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Inputs reach the shell through env, never through ${{ }} inside run:, so a
    # crafted revision name or reason cannot inject commands.
    env:
      TARGET_ENV: ${{ inputs.environment }}
      TARGET_APP: ${{ inputs.app }}
      TARGET_REVISION: ${{ inputs.target_revision }}
      TRAFFIC: ${{ inputs.traffic_percentage }}
      INCIDENT_REASON: ${{ inputs.incident_reason }}
      API_URL: ${{ inputs.environment == 'production' && vars.PROD_API_URL || vars.STAGING_API_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute Rapid Rollback Script
        run: |
          set -euo pipefail
          # Until a custom domain is live, verify against the app's own ingress FQDN.
          API_URL="${API_URL:-https://$(az containerapp show -n "ca-api-lensio-${TARGET_ENV}" -g "rg-lensio-${TARGET_ENV}" --query properties.configuration.ingress.fqdn -o tsv)}"
          ./scripts/rollback.sh \
            --env "${TARGET_ENV}" \
            --app "${TARGET_APP}" \
            --target-revision "${TARGET_REVISION}" \
            --traffic "${TRAFFIC}" \
            --api-url "${API_URL}"

      - name: Post-Rollback Audit Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### 🚨 Lensio Emergency Rollback Report"
            echo "- **Environment**: \`${TARGET_ENV}\`"
            echo "- **Component**: \`${TARGET_APP}\`"
            echo "- **Target Revision**: \`${TARGET_REVISION}\`"
            echo "- **Traffic Shift**: \`${TRAFFIC}%\`"
            echo "- **Incident Reason**: ${INCIDENT_REASON}"
            echo "- **Triggered By**: @${GITHUB_ACTOR}"
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "- **Status**: ✅ Traffic shifted and verified"
            else
              echo "- **Status**: ❌ Rollback ${JOB_STATUS} — check the logs above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
