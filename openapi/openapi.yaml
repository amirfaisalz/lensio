openapi: 3.0.3
info:
  title: Lensio API
  version: 1.0.0
  description: |
    Indonesian Identity Document OCR API as a Service (KTP & SIM).
    Affordable, privacy-conscious, and production-grade identity data extraction.

    ### API Versioning & Contract Evolution (ADR-007)
    Lensio follows explicit URL path versioning (`/api/v1/`). All minor and patch evolutions are strictly
    additive and backward-compatible (Postel's Law / Tolerant Reader Pattern). When an endpoint is deprecated,
    Lensio provides a minimum 12-month notice window with standard `Deprecation`, `Sunset` (RFC 8594), and
    `Link` (RFC 8288) HTTP response headers before decommissioning.
  contact:
    name: Lensio Engineering Team
    url: https://lensio.dev
    email: api@lensio.dev
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.staging.lensio.dev
    description: Staging environment
  - url: https://api.lensio.dev
    description: Production environment

tags:
  - name: System
    description: Health and readiness probes
  - name: Authentication
    description: Scoped API key lifecycle management
  - name: OCR
    description: Indonesian KTP extraction pipeline
  - name: Usage
    description: Usage metering, daily metrics, and audit records
  - name: Account
    description: Organization profile and subscription plan details

paths:
  /health:
    get:
      summary: Liveness Probe
      description: Verifies that the API service process is alive.
      operationId: getHealth
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /ready:
    get:
      summary: Readiness Probe
      description: Verifies that all dependencies (PostgreSQL database) are healthy.
      operationId: getReady
      tags:
        - System
      responses:
        '200':
          description: Service and dependencies are ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degraded
                  database:
                    type: string
                    example: unreachable
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/auth/api-keys:
    post:
      summary: Create API Key
      description: |
        Generates a new cryptographically secure API key.
        The plaintext token is displayed only once upon creation and cannot be retrieved later.
      operationId: createAPIKey
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Human-readable label for the API key
                  example: Production Backend Service
                environment:
                  type: string
                  enum: [live, test]
                  default: live
                  example: live
                scopes:
                  type: array
                  items:
                    type: string
                  example: ["ocr:read", "ocr:write", "usage:read"]
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Optional expiry timestamp
                  example: "2027-01-01T00:00:00Z"
                org_id:
                  type: string
                  format: uuid
                  description: Organization ID (optional if authenticated or default org used)
      responses:
        '201':
          description: API key created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  org_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  key:
                    type: string
                    description: Plaintext API key token (returned only once)
                    example: lensio_live_a1b2c3d4e5f6...
                  prefix:
                    type: string
                    example: lensio_live_a1b2
                  scopes:
                    type: array
                    items:
                      type: string
                  environment:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidAPIKey'

    get:
      summary: List API Keys
      description: Lists active and revoked API keys for the caller's organization. Secrets are masked.
      operationId: listAPIKeys
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: List of organization API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKeyListItem'
        '401':
          $ref: '#/components/responses/InvalidAPIKey'

  /api/v1/auth/api-keys/{id}:
    delete:
      summary: Revoke API Key
      description: Immediately revokes an API key, preventing any further requests using it.
      operationId: revokeAPIKey
      tags:
        - Authentication
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key successfully revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: API key successfully revoked
                  id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/InvalidAPIKey'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/verify:
    get:
      summary: Verify Authentication
      description: Verifies current API key or OIDC bearer token and returns caller identity and scopes.
      operationId: verifyAuth
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - OIDCAuth: []
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: authenticated
                  auth_type:
                    type: string
                    example: oidc
                  key_id:
                    type: string
                    format: uuid
                  org_id:
                    type: string
                    format: uuid
                  scopes:
                    type: array
                    items:
                      type: string
                  subject:
                    type: string
                  email:
                    type: string
                  preferred_username:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/InvalidAPIKey'

  /api/v1/ocr/ktp:
    post:
      summary: Extract Indonesian KTP OCR Data
      description: |
        Processes an uploaded Indonesian KTP image, performs classification,
        extracts text fields, and validates them deterministically.
      operationId: extractKTP
      tags:
        - OCR
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 256
          description: Unique client token to guarantee safe retries without duplicate processing or billing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
              properties:
                document:
                  type: string
                  format: binary
                  description: KTP image file (JPEG, PNG, WebP up to 5MB)
      responses:
        '200':
          description: Successfully extracted and validated KTP data
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
              description: True if the response was served from the idempotency cache without re-processing.
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KTPResponse'
        '400':
          $ref: '#/components/responses/InvalidDocument'
        '401':
          $ref: '#/components/responses/InvalidAPIKey'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '422':
          $ref: '#/components/responses/UnsupportedDocument'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/OCRFailed'

  /api/v1/ocr/sim:
    post:
      summary: Extract Indonesian SIM OCR Data
      description: |
        Processes an uploaded Indonesian Driver's License (SIM - Surat Izin Mengemudi) image,
        performs classification, extracts text fields, and validates them deterministically.
      operationId: extractSIM
      tags:
        - OCR
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 256
          description: Unique client token to guarantee safe retries without duplicate processing or billing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
              properties:
                document:
                  type: string
                  format: binary
                  description: SIM image file (JPEG, PNG, WebP up to 5MB)
      responses:
        '200':
          description: Successfully extracted and validated SIM data
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
              description: True if the response was served from the idempotency cache without re-processing.
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SIMResponse'
        '400':
          $ref: '#/components/responses/InvalidDocument'
        '401':
          $ref: '#/components/responses/InvalidAPIKey'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '422':
          $ref: '#/components/responses/UnsupportedDocument'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/OCRFailed'

  /api/v1/ocr/passport:
    post:
      summary: Extract Indonesian Passport OCR Data
      description: |
        Processes an uploaded Indonesian Passport (Paspor Republik Indonesia) image,
        performs classification, extracts visual text fields and MRZ (Machine Readable Zone),
        and validates them deterministically using ICAO Doc 9303 checksum standards.
      operationId: extractPassport
      tags:
        - OCR
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 256
          description: Unique client token to guarantee safe retries without duplicate processing or billing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
              properties:
                document:
                  type: string
                  format: binary
                  description: Passport image file (JPEG, PNG, WebP up to 5MB)
      responses:
        '200':
          description: Successfully extracted and validated Passport data
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
              description: True if the response was served from the idempotency cache without re-processing.
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassportResponse'
        '400':
          $ref: '#/components/responses/InvalidDocument'
        '401':
          $ref: '#/components/responses/InvalidAPIKey'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '422':
          $ref: '#/components/responses/UnsupportedDocument'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/OCRFailed'

  /api/v1/ocr/npwp:
    post:
      summary: Extract Indonesian NPWP OCR Data
      description: |
        Processes an uploaded Indonesian NPWP (Nomor Pokok Wajib Pajak) card image,
        performs classification, extracts taxpayer identity details (NPWP, Name, NIK, Address, KPP),
        and validates NPWP format (15-digit Luhn Modulo 10 or 16-digit format) deterministically.
      operationId: extractNPWP
      tags:
        - OCR
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 256
          description: Unique client token to guarantee safe retries without duplicate processing or billing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
              properties:
                document:
                  type: string
                  format: binary
                  description: NPWP card image file (JPEG, PNG, WebP up to 5MB)
      responses:
        '200':
          description: Successfully extracted and validated NPWP data
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
              description: True if the response was served from the idempotency cache without re-processing.
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NPWPResponse'
        '400':
          $ref: '#/components/responses/InvalidDocument'
        '401':
          $ref: '#/components/responses/InvalidAPIKey'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '422':
          $ref: '#/components/responses/UnsupportedDocument'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/OCRFailed'

  /api/v1/ocr/kk:
    post:
      summary: Extract Indonesian Kartu Keluarga OCR Data
      description: |
        Processes an uploaded Indonesian Kartu Keluarga (KK) document image,
        performs classification, extracts family household information (Nomor KK, Kepala Keluarga, Address),
        extracts tabular family member rows with NIK, relations, and demographics,
        and validates document structure deterministically.
      operationId: extractKK
      tags:
        - OCR
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 256
          description: Unique client token to guarantee safe retries without duplicate processing or billing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
              properties:
                document:
                  type: string
                  format: binary
                  description: Kartu Keluarga document image file (JPEG, PNG, WebP up to 5MB)
      responses:
        '200':
          description: Successfully extracted and validated Kartu Keluarga data
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
              description: True if the response was served from the idempotency cache without re-processing.
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KKResponse'
        '400':
          $ref: '#/components/responses/InvalidDocument'
        '401':
          $ref: '#/components/responses/InvalidAPIKey'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '422':
          $ref: '#/components/responses/UnsupportedDocument'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '502':
          $ref: '#/components/responses/OCRFailed'

  /api/v1/ocr/{id}:
    get:
      summary: Get OCR Request Status / Metadata
      description: Retrieves previous OCR execution metadata (non-PII) by ID.
      operationId: getOCRRequest
      tags:
        - OCR
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OCR request metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCRRequestMetadata'
        '401':
          $ref: '#/components/responses/InvalidAPIKey'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/usage:
    get:
      summary: Get Usage Summary
      description: Retrieves organization usage metrics and quota consumption for current billing cycle.
      operationId: getUsageSummary
      tags:
        - Usage
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Organization usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '401':
          $ref: '#/components/responses/InvalidAPIKey'
        '403':
          $ref: '#/components/responses/InsufficientScope'

  /api/v1/usage/daily:
    get:
      summary: Get Daily Usage Timeseries
      description: Retrieves daily breakdown of requests and status codes.
      operationId: getDailyUsage
      tags:
        - Usage
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daily usage timeseries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        total_requests:
                          type: integer
                        success_count:
                          type: integer
                        error_count:
                          type: integer
        '401':
          $ref: '#/components/responses/InvalidAPIKey'

  /api/v1/usage/endpoints:
    get:
      summary: Get Usage by Endpoint
      description: Retrieves breakdown of requests partitioned by endpoint.
      operationId: getEndpointUsage
      tags:
        - Usage
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Endpoint usage breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        endpoint:
                          type: string
                        total_requests:
                          type: integer
                        avg_latency_ms:
                          type: number
        '401':
          $ref: '#/components/responses/InvalidAPIKey'

  /api/v1/usage/records:
    get:
      summary: Get Request Execution Logs
      description: Retrieves paginated request logs with latency and status codes for the Request Explorer (strictly non-PII).
      operationId: getUsageRecords
      tags:
        - Usage
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: status_code
          in: query
          required: false
          schema:
            type: integer
        - name: endpoint
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated request log records
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        request_id:
                          type: string
                        endpoint:
                          type: string
                        status_code:
                          type: integer
                        latency_ms:
                          type: integer
                        timestamp:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/InvalidAPIKey'

  /api/v1/account:
    get:
      summary: Get Account Details
      description: Retrieves current organization details, active keys count, and plan.
      operationId: getAccount
      tags:
        - Account
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account information
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization_id:
                    type: string
                    format: uuid
                  organization_name:
                    type: string
                  plan_code:
                    type: string
                  active_keys_count:
                    type: integer
        '401':
          $ref: '#/components/responses/InvalidAPIKey'

  /api/v1/account/plan:
    get:
      summary: Get Plan & Limits
      description: Retrieves current organization plan limits, monthly quota, and rate limits.
      operationId: getAccountPlan
      tags:
        - Account
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Plan details
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_code:
                    type: string
                    example: starter
                  plan_name:
                    type: string
                    example: Starter Tier
                  monthly_quota:
                    type: integer
                    example: 1000
                  rate_limit_per_minute:
                    type: integer
                    example: 30
        '401':
          $ref: '#/components/responses/InvalidAPIKey'

  /api/v1/account/members:
    get:
      summary: Get Organization Members
      description: Retrieves team members and roles registered under the caller's organization.
      operationId: getAccountMembers
      tags:
        - Account
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Organization team members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        org_id:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        full_name:
                          type: string
                        role:
                          type: string
                        created_at:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/InvalidAPIKey'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Lensio API Key (lensio_live_... or lensio_test_...)
    OIDCAuth:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8082/realms/lensio/.well-known/openid-configuration
      description: OpenID Connect Bearer token from Keycloak

  headers:
    X-RateLimit-Limit:
      schema:
        type: integer
      description: Maximum requests permitted in current minute window
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: Remaining requests in current minute window
    X-RateLimit-Reset:
      schema:
        type: integer
      description: Unix epoch seconds when the rate limit window resets
    Retry-After:
      schema:
        type: integer
      description: Seconds to wait before retrying after a 429 response
    Deprecation:
      schema:
        type: string
        example: "true"
      description: Standard IETF deprecation indicator ('true' or date when the endpoint was marked deprecated)
    Sunset:
      schema:
        type: string
        example: "2027-09-12"
      description: RFC 8594 sunset date indicating when the resource will be permanently decommissioned
    Link:
      schema:
        type: string
        example: '<https://docs.lensio.dev/migration/v1-to-v2>; rel="sunset"'
      description: RFC 8288 web link header providing relations to migration guides or successor endpoints

  schemas:
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - invalid_api_key
                - insufficient_scope
                - rate_limit_exceeded
                - quota_exceeded
                - invalid_document
                - unsupported_document
                - ocr_failed
                - low_confidence
                - internal_error
                - request_in_progress
                - idempotency_key_mismatch
              example: invalid_document
            message:
              type: string
              example: The uploaded document could not be processed
            request_id:
              type: string
              example: req_01JABC12345

    APIKeyListItem:
      type: object
      properties:
