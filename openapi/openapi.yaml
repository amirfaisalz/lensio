  responses:
    InvalidRequest:
      description: Malformed request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: invalid_request
              message: Missing required field 'name'
              request_id: req_01JABC12345

    InvalidAPIKey:
      description: Authentication failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: invalid_api_key
              message: Invalid or unrecognized API key
              request_id: req_01JABC12345

    InsufficientScope:
      description: Authorization failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: insufficient_scope
              message: "API key lacks required scope: ocr:write"
              request_id: req_01JABC12345

    InvalidDocument:
      description: Corrupt or unreadable image upload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: invalid_document
              message: File exceeds 5MB or invalid image format
              request_id: req_01JABC12345

    UnsupportedDocument:
      description: Image is not an Indonesian KTP
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: unsupported_document
              message: Uploaded image was not identified as an Indonesian KTP
              request_id: req_01JABC12345

    RateLimitExceeded:
      description: Rate limit exceeded
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: rate_limit_exceeded
              message: API rate limit exceeded
              request_id: req_01JABC12345

    QuotaExceeded:
      description: Plan monthly quota exhausted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: quota_exceeded
              message: Monthly quota limit reached
              request_id: req_01JABC12345

    OCRFailed:
      description: Upstream OCR engine failure or timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: ocr_failed
              message: OCR engine processing timeout
              request_id: req_01JABC12345

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: invalid_request
              message: Resource not found
              request_id: req_01JABC12345

    RequestInProgress:
      description: A request with this Idempotency-Key is currently being processed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: request_in_progress
              message: A request with this Idempotency-Key is currently in progress
              request_id: req_01JABC12345

    IdempotencyKeyMismatch:
      description: Idempotency-Key was previously used with a different request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: idempotency_key_mismatch
              message: Idempotency-Key was previously used with a different request payload
              request_id: req_01JABC12345

