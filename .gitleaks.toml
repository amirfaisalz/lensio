# NusaID Gitleaks Configuration
# Enforces zero secrets committed while allowlisting deterministic synthetic fixtures and test mocks.

title = "NusaID Gitleaks Secret Detection Policy"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for synthetic test data, fixtures, documentation, and mock keys"
paths = [
  '''tests/fixtures/synthetic/.*''',
  '''tests/fixtures/.*''',
  '''tests/.*_test\.go''',
  '''apps/dashboard/src/.*\.test\.(ts|tsx)''',
  '''openapi/openapi\.yaml''',
  '''\.env\.example''',
  '''docker-compose\.yml''',
  '''DEVELOPMENT_CHECKLIST\.md''',
  '''PRD\.md''',
  '''AGENTS\.md'''
]
regexes = [
  '''nusa_(live|test)_[a-zA-Z0-9]{32,}''',
  '''nusaid_dev_password''',
  '''nusaid_test_password''',
  '''req_[0-9A-Z]{10,}''',
  '''AIzaSy[A-Za-z0-9_-]{33}'''
]
