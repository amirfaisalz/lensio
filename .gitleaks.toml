# Lensio Gitleaks Configuration
# Enforces zero secrets committed while allowlisting deterministic synthetic fixtures and test mocks.

title = "Lensio Gitleaks Secret Detection Policy"

[extend]
useDefault = true

[allowlist]
description = "Path-scoped allowlist for synthetic fixtures, tests, and examples only. No global regex allowlist: real lensio_live_*, AIzaSy, and password patterns must ALWAYS be flagged outside these paths."
paths = [
  '''tests/fixtures/synthetic/.*''',
  '''tests/fixtures/.*''',
  '''tests/.*''',
  '''.*_test\.go''',
  '''apps/dashboard/src/.*\.test\.(ts|tsx)''',
  '''openapi/openapi\.yaml''',
  '''infra/.*\.tftest\.hcl''',
  '''\.env\.example''',
  '''docker-compose\.yml''',
  '''DEVELOPMENT_TRACKING\.md''',
  '''PRD\.md''',
  '''AGENTS\.md''',
  '''docs/demo-walkthrough\.md''',
  '''docs/decisions/ADR-002.*'''
]
