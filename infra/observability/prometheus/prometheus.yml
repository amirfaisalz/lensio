global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerting_rules.yml"

scrape_configs:
  - job_name: 'lensio-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8080', 'host.docker.internal:8080']
        labels:
          service: 'lensio-api'
          env: 'development'
