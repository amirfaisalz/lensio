services:
  # WARNING (dev-only): credentials below are public example values for local
  # development. NEVER use them in staging/production. Prod secrets must be
  # injected via environment / Azure Key Vault (see docs/security.md, PRIVACY.md).
  postgres:
    image: postgres:16-alpine
    container_name: lensio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lensio
      POSTGRES_PASSWORD: lensio_dev_password
      POSTGRES_DB: lensio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lensio -d lensio"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: lensio-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lensio-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENV: "development"
      DATABASE_URL: "postgres://lensio:lensio_dev_password@postgres:5432/lensio?sslmode=disable"
      LOG_LEVEL: "info"
      OCR_PROVIDER: "${OCR_PROVIDER:-mock}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.6-flash}"
      SPICEDB_ENDPOINT: "${SPICEDB_ENDPOINT:-http://spicedb:8443}"
      SPICEDB_PRESHARED_KEY: "${SPICEDB_PRESHARED_KEY:-lensio_spicedb_key}"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: lensio-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: lensio-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: lensio-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8080
    ports:
      - "8082:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  spicedb:
    image: authzed/spicedb:latest
    container_name: lensio-spicedb
    restart: unless-stopped
    command: serve-testing --http-enabled
    ports:
      - "50051:50051"
      - "8443:8443"
    environment:
      - SPICEDB_GRPC_PRESHARED_KEY=lensio_spicedb_key

volumes:
  postgres_data:
  grafana_data:
